name: Build Tauri app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build TradeJournal
        run: npm run build

      - name: Collect artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $exe = Get-ChildItem src-tauri/target/release -File -Filter *.exe |
            Where-Object { $_.BaseName -in @('TradeJournal', 'tradejournal') } |
            Select-Object -First 1
          if (-not $exe) { throw 'TradeJournal executable was not produced.' }
          Copy-Item $exe.FullName artifacts/TradeJournal.exe
          Compress-Archive -Path $exe.FullName -DestinationPath "artifacts/TradeJournal-portable-$version-x64.zip" -Force
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe artifacts/
          Get-ChildItem artifacts -File | Where-Object { $_.Extension -ne '.txt' } | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/SHA256SUMS.txt
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TradeJournal-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
