name: Build Tauri app

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}'
          if ($tag -ne "v$version") {
            throw "Tag $tag does not match package.json version v$version."
          }

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Check versions
        run: npm run check:versions

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # Clippy could not be run locally without the MSVC linker. Keep it
      # visible but non-blocking until the first CI run confirms a clean baseline.
      - name: Run clippy
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build web assets for Rust tests
        run: npm run web:build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build TradeJournal
        if: github.event_name != 'pull_request'
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect artifacts
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $exe = Get-ChildItem src-tauri/target/release -File -Filter *.exe |
            Where-Object { $_.BaseName -in @('TradeJournal', 'tradejournal') } |
            Select-Object -First 1
          if (-not $exe) { throw 'TradeJournal executable was not produced.' }
          Copy-Item $exe.FullName artifacts/TradeJournal.exe
          Compress-Archive -Path $exe.FullName -DestinationPath "artifacts/TradeJournal-portable-$version-x64.zip" -Force
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -File -Filter *.exe |
            Select-Object -First 1
          if (-not $setup) { throw 'TradeJournal NSIS installer was not produced.' }
          Copy-Item $setup.FullName artifacts/
          $signaturePath = "$($setup.FullName).sig"
          if (-not (Test-Path $signaturePath)) { throw 'Updater signature was not produced.' }
          Copy-Item $signaturePath artifacts/
          $signature = (Get-Content $signaturePath -Raw).Trim()
          $latest = [ordered]@{
            version = $version
            notes = "TradeJournal $version"
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signature
                url = "https://github.com/FamaSALO/tradejournal/releases/download/v$version/$($setup.Name)"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content -Path artifacts/latest.json -Encoding utf8
          Get-ChildItem artifacts -File | Where-Object { $_.Extension -notin @('.txt', '.json', '.sig') } | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/SHA256SUMS.txt
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: TradeJournal-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: TradeJournal-${{ github.sha }}
          path: artifacts

      - name: Check that no release exists for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft \
            --jq ".[] | select(.tagName == \"${GITHUB_REF_NAME}\") | .isDraft")
          if [ -n "$existing" ]; then
            if [ "$existing" = "true" ]; then
              echo "::error::Draft release ${GITHUB_REF_NAME} already exists. Remove it first: gh release delete ${GITHUB_REF_NAME} --yes"
            else
              echo "::error::Release ${GITHUB_REF_NAME} already exists; refusing to overwrite."
            fi
            exit 1
          fi

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(artifacts/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets were downloaded."
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "TradeJournal ${GITHUB_REF_NAME}" \
            --draft \
            --generate-notes \
            --verify-tag
