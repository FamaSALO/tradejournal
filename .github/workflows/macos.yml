name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - feat/macos-universal
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS universal
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match package.json version v$version." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-universal

      - name: Install npm dependencies
        run: npm ci

      - name: Check versions
        run: npm run check:versions

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # generate_context! in src-tauri requires the web assets to exist.
      - name: Build web assets for Rust checks
        run: npm run web:build

      - name: Run clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build universal DMG
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect artifacts
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mkdir -p artifacts

          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n 1)
          if [ -z "$dmg" ]; then
            echo "DMG was not produced." >&2
            exit 1
          fi
          cp "$dmg" "artifacts/TradeJournal_${version}_universal.dmg"

          cd artifacts
          shasum -a 256 *.dmg > SHA256SUMS.txt
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TradeJournal-macos-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
