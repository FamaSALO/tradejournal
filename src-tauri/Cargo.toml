[package]
name = "tradejournal"
version = "2.5.1"
description = "TradeJournal — локальный дневник трейдера для Windows и macOS"
authors = ["FamaSALO"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tradejournal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rfd = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
